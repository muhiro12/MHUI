name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release version selection
        run: python3 -m unittest discover -s ci_scripts/release -p 'test_*.py'

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin

          # Queued runs must not publish an older main snapshot after a newer push.
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Skipping a commit that is no longer the main tip."
            exit 0
          fi

          version=$(python3 ci_scripts/release/next_version.py)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null 2>&1; then
            tag_commit=$(git rev-parse "$version^{commit}")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Refusing to release a tag belonging to another commit." >&2
              exit 1
            fi
            gh release create "$version" --verify-tag --generate-notes
          else
            gh release create "$version" --target "$GITHUB_SHA" --generate-notes
          fi
